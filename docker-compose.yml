version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: retail_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  redis:
    image: redis:7-alpine
    container_name: retail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: retail-clickhouse
    environment:
      CLICKHOUSE_DB: retail_intelligence
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://retail_user:retail_password@postgres:5432/retail_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - retail_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://retail_user:retail_password@postgres:5432/retail_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: celery -A app.tasks worker --loglevel=info
    networks:
      - retail_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - retail_network

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  retail_network:
    driver: bridge
